name: ArthaNexus CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Financial Quant Formulas Tests
        run: node --test packages/financial-formulas/tests/formulas.test.js

      - name: Run DataGrid Pipeline & Quality Gate Tests
        run: node --test tests/unit/pipeline.test.js

      - name: Run Engine REST API Integration Tests
        run: node --test apps/engine/tests/engine.test.js

      - name: Build Static Terminal Assets for Pages
        run: node apps/web/scripts/build_static.js

      - name: Verify Health Script
        run: node scripts/verify_health.js
